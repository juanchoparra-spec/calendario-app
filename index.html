<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CalendarIQ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0C2340">
<style>
  :root{
    --bg:#EAF1FA;
    --card:#FFFFFF;
    --accent:#185FA5;
    --accent-light:#E6F1FB;
    --accent-dark:#0C447C;
    --danger:#A32D2D;
    --danger-light:#FCEBEB;
    --danger-border:#E24B4A;
    --gray-text:#5F5E5A;
    --gray-light:#F1EFE8;
    --border:#B5D4F4;
    --text:#2C2C2A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:2rem;
  }
  .container{max-width:480px;margin:0 auto;padding:1rem;}
  h1{font-size:20px;font-weight:600;margin:0;color:var(--accent-dark);}
  .app-header{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;}
  .app-logo{width:48px;height:48px;border-radius:10px;flex:0 0 auto;}
  .weeks{display:flex;gap:6px;margin-bottom:1rem;overflow-x:auto;padding-bottom:4px;}
  .week-btn{
    flex:0 0 auto;padding:10px 16px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--card);color:var(--gray-text);font-size:13px;font-weight:600;
    white-space:nowrap;
  }
  .week-btn.active{background:var(--accent);color:white;border-color:var(--accent);}
  .toolbar{display:flex;gap:8px;margin-bottom:1rem;align-items:center;}
  #searchInput{
    flex:1;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-size:14px;background:var(--card);
  }
  #refreshBtn{
    width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border);
    background:var(--card);display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--accent);flex:0 0 auto;
  }
  #refreshBtn.spinning{animation:spin 0.8s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .fomc-card{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;
    margin-bottom:1.25rem;border:1.5px solid;
  }
  .fomc-card.has-event{background:var(--danger-light);border-color:var(--danger-border);}
  .fomc-card.no-event{background:var(--gray-light);border-color:var(--border);}
  .fomc-icon{font-size:22px;flex:0 0 auto;}
  .fomc-seal{width:40px;height:40px;flex:0 0 auto;border-radius:50%;}
  .fomc-title{font-size:14px;font-weight:600;margin:0;}
  .fomc-card.has-event .fomc-title{color:#1A1A1A;font-weight:700;}
  .fomc-card.no-event .fomc-title{color:var(--gray-text);font-weight:500;}
  .fomc-sub{font-size:12px;margin:2px 0 0;}
  .fomc-card.has-event .fomc-sub{color:#1A1A1A;font-weight:700;}
  .day-label{font-size:15px;font-weight:600;margin:0 0 8px;color:var(--text);}
  .day-block{margin-bottom:14px;}
  .ticker-card{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;
    padding:10px 12px;margin-bottom:8px;
  }
  .ticker-left{display:flex;align-items:center;gap:10px;}
  .ticker-logo{
    width:34px;height:34px;border-radius:8px;background:var(--gray-light);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
  }
  .ticker-logo img{width:100%;height:100%;object-fit:contain;}
  .ticker-logo span{font-size:10px;font-weight:700;color:var(--gray-text);}
  .ticker-sym{font-size:14px;font-weight:600;}
  .ticker-time{
    font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;
    white-space:nowrap;display:flex;align-items:center;gap:4px;
  }
  .ticker-time.bmo{background:var(--accent-light);color:var(--accent-dark);}
  .ticker-time.amc{background:var(--gray-light);color:var(--gray-text);}
  .ticker-time.na{background:var(--gray-light);color:var(--gray-text);}
  .status-line{
    text-align:center;font-size:11px;color:var(--gray-text);margin:1rem 0 0.5rem;
  }
  .empty-state{text-align:center;color:var(--gray-text);font-size:13px;padding:2rem 0;}
  .loading{text-align:center;color:var(--gray-text);font-size:13px;padding:2rem 0;}
  .suggest-box{
    position:absolute;top:48px;left:0;right:52px;background:var(--card);
    border:1.5px solid var(--border);border-radius:12px;z-index:20;
    max-height:280px;overflow-y:auto;box-shadow:0 6px 16px rgba(12,35,64,0.15);
    display:none;
  }
  .suggest-box.open{display:block;}
  .suggest-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-bottom:1px solid var(--gray-light);
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-logo{
    width:30px;height:30px;border-radius:7px;background:var(--gray-light);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
  }
  .suggest-logo img{width:100%;height:100%;object-fit:contain;}
  .suggest-logo span{font-size:9px;font-weight:700;color:var(--gray-text);}
  .suggest-text{display:flex;flex-direction:column;overflow:hidden;}
  .suggest-sym{font-size:13px;font-weight:700;}
  .suggest-name{font-size:11px;color:var(--gray-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="container">
  <div class="app-header">
    <img src="icon-192.png" alt="CalendarIQ" class="app-logo">
    <h1>CalendarIQ</h1>
  </div>

  <div class="weeks" id="weekTabs"></div>

  <div class="toolbar" style="position:relative;">
    <input type="text" id="searchInput" placeholder="Buscar ticker o empresa" autocomplete="off">
    <button id="refreshBtn" title="Actualizar">&#8635;</button>
    <div id="suggestBox" class="suggest-box"></div>
  </div>

  <div id="fomcArea"></div>
  <div id="daysArea"></div>
  <div class="status-line" id="statusLine"></div>
</div>

<script>
const FINNHUB_KEY = "d8ukhg9r01qrt65sdm00d8ukhg9r01qrt65sdm0g";
const BASE = "https://finnhub.io/api/v1";

const WATCHLIST = [
  "NVDA","PLTR","DELL","AAPL","AMZN","SCHW","MSFT","UBER","JPM","CRCL",
  "AMD","BRK.B","ORCL","WFC","KO","CVX","XOM","TSLA","MRNA","BAC",
  "META","NFLX","GOOG","SPCX","AVGO","CRM","DIS","COST"
];

let currentWeek = 0;
let extraSearched = [];

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function mondayOf(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate()+diff);
  return d;
}
function weekRange(offset){
  const base = mondayOf(new Date());
  const start = new Date(base);
  start.setDate(start.getDate() + offset*7);
  const end = new Date(start);
  end.setDate(end.getDate()+4);
  return {start, end, key: toISO(start)};
}
function fmtDayLabel(date){
  const days = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
  return days[date.getDay()] + " " + date.getDate();
}

function cacheGet(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function cacheSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){}
}

async function fetchEarningsWeek(offset, force){
  const {start, end, key} = weekRange(offset);
  const cacheKey = "earnings_" + key;
  if(!force){
    const cached = cacheGet(cacheKey);
    if(cached) return cached;
  }
  const url = BASE + "/calendar/earnings?from=" + toISO(start) + "&to=" + toISO(end) + "&token=" + FINNHUB_KEY;
  const res = await fetch(url);
  if(!res.ok) throw new Error("earnings_fetch_failed");
  const data = await res.json();
  const payload = { data, fetchedAt: Date.now() };
  cacheSet(cacheKey, payload);
  return payload;
}

const FOMC_2026 = [
  {start:"2026-01-27", end:"2026-01-28"},
  {start:"2026-03-17", end:"2026-03-18"},
  {start:"2026-04-28", end:"2026-04-29"},
  {start:"2026-06-16", end:"2026-06-17"},
  {start:"2026-07-28", end:"2026-07-29"},
  {start:"2026-09-15", end:"2026-09-16"},
  {start:"2026-10-27", end:"2026-10-28"},
  {start:"2026-12-08", end:"2026-12-09"}
];

function fomcInWeek(weekStart, weekEnd){
  const ws = toISO(weekStart), we = toISO(weekEnd);
  return FOMC_2026.find(m => m.end >= ws && m.start <= we) || null;
}

function fmtFomcDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const days = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
  const months = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  return days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()];
}

async function fetchLogo(symbol){
  const cacheKey = "logo_" + symbol;
  const cached = cacheGet(cacheKey);
  if(cached) return cached.logo;
  try{
    const url = BASE + "/stock/profile2?symbol=" + encodeURIComponent(symbol) + "&token=" + FINNHUB_KEY;
    const res = await fetch(url);
    if(!res.ok) throw new Error("logo_fetch_failed");
    const data = await res.json();
    cacheSet(cacheKey, { logo: data.logo || "", fetchedAt: Date.now() });
    return data.logo || "";
  }catch(e){
    return "";
  }
}

function renderWeekTabs(){
  const wrap = document.getElementById("weekTabs");
  wrap.innerHTML = "";
  const labels = ["Esta semana","Sem +1"];
  labels.forEach((lbl, i)=>{
    const btn = document.createElement("button");
    btn.className = "week-btn" + (i===currentWeek ? " active" : "");
    btn.textContent = lbl;
    btn.onclick = ()=>{ currentWeek = i; extraSearched = []; renderWeekTabs(); loadWeek(false); };
    wrap.appendChild(btn);
  });
}

function timeBadge(hourTag){
  if(hourTag === "bmo"){
    return '<span class="ticker-time bmo">&#127749; Antes apertura</span>';
  }
  if(hourTag === "amc"){
    return '<span class="ticker-time amc">&#127772; Despues cierre</span>';
  }
  return '<span class="ticker-time na">Sin hora confirmada</span>';
}

async function renderTickerCard(item){
  const card = document.createElement("div");
  card.className = "ticker-card";
  const logoUrl = await fetchLogo(item.symbol);
  card.innerHTML = `
    <div class="ticker-left">
      <div class="ticker-logo">${logoUrl ? `<img src="${logoUrl}" alt="${item.symbol}">` : `<span>${item.symbol.slice(0,4)}</span>`}</div>
      <span class="ticker-sym">${item.symbol}</span>
    </div>
    ${timeBadge(item.hour)}
  `;
  return card;
}

async function loadWeek(force){
  const daysArea = document.getElementById("daysArea");
  const fomcArea = document.getElementById("fomcArea");
  const statusLine = document.getElementById("statusLine");
  const refreshBtn = document.getElementById("refreshBtn");

  daysArea.innerHTML = '<div class="loading">Cargando semana...</div>';
  fomcArea.innerHTML = "";
  refreshBtn.classList.add("spinning");

  const {start, end} = weekRange(currentWeek);

  let earningsPayload, usedCache = true;
  try{
    earningsPayload = await fetchEarningsWeek(currentWeek, force);
    usedCache = !force;
  }catch(e){
    const cachedE = cacheGet("earnings_" + weekRange(currentWeek).key);
    if(cachedE){
      earningsPayload = cachedE;
      statusLine.textContent = "No se pudo actualizar. Mostrando datos guardados.";
    } else {
      daysArea.innerHTML = '<div class="empty-state">No se pudo cargar esta semana. Intenta de nuevo.</div>';
      refreshBtn.classList.remove("spinning");
      return;
    }
  }

  refreshBtn.classList.remove("spinning");

  // FOMC block (fechas fijas verificadas)
  const fomcMeeting = fomcInWeek(start, end);
  const fomcCard = document.createElement("div");
  if(fomcMeeting){
    fomcCard.className = "fomc-card has-event";
    fomcCard.innerHTML = `
      <img src="fed-seal.png" alt="FED" class="fomc-seal">
      <div>
        <p class="fomc-title">FOMC: ${fmtFomcDate(fomcMeeting.end)}, 2:00 PM ET</p>
        <p class="fomc-sub">Decision de tasas de interes</p>
      </div>
    `;
  } else {
    fomcCard.className = "fomc-card no-event";
    fomcCard.innerHTML = `
      <div class="fomc-icon">&#128197;</div>
      <p class="fomc-title">Sin reunion de la FED esta semana</p>
    `;
  }
  fomcArea.innerHTML = "";
  fomcArea.appendChild(fomcCard);

  // Earnings, filtered by watchlist + extra searched
  const allowed = new Set([...WATCHLIST, ...extraSearched]);
  const raw = (earningsPayload.data && earningsPayload.data.earningsCalendar) || [];
  let filtered = raw.filter(item => allowed.has((item.symbol||"").toUpperCase()));

  // Group by date
  const byDate = {};
  filtered.forEach(item=>{
    if(!byDate[item.date]) byDate[item.date] = [];
    byDate[item.date].push(item);
  });
  const dateKeys = Object.keys(byDate).sort();

  daysArea.innerHTML = "";
  if(dateKeys.length === 0){
    daysArea.innerHTML = '<div class="empty-state">No hay reportes de tu lista programados esta semana.</div>';
  } else {
    for(const dk of dateKeys){
      const dateObj = new Date(dk + "T00:00:00");
      const block = document.createElement("div");
      block.className = "day-block";
      const label = document.createElement("p");
      label.className = "day-label";
      label.textContent = fmtDayLabel(dateObj).replace(/^\w/, c=>c.toUpperCase());
      block.appendChild(label);
      for(const item of byDate[dk]){
        const card = await renderTickerCard(item);
        block.appendChild(card);
      }
      daysArea.appendChild(block);
    }
  }

  const fetchedAt = usedCache ? (earningsPayload.fetchedAt) : Date.now();
  const mins = Math.round((Date.now() - fetchedAt) / 60000);
  statusLine.textContent = mins < 1 ? "Actualizado justo ahora" : `Ultima actualizacion: hace ${mins} min`;
}

document.getElementById("refreshBtn").addEventListener("click", ()=>{
  loadWeek(true);
});

async function searchSymbols(query){
  const cacheKey = "search_" + query;
  const cached = cacheGet(cacheKey);
  if(cached && (Date.now() - cached.fetchedAt) < 24 * 60 * 60 * 1000){
    return cached.results;
  }
  try{
    const url = BASE + "/search?q=" + encodeURIComponent(query) + "&token=" + FINNHUB_KEY;
    const res = await fetch(url);
    if(!res.ok) throw new Error("search_failed");
    const data = await res.json();
    const results = (data.result || [])
      .filter(r => r.type === "Common Stock" && !r.symbol.includes("."))
      .slice(0, 8);
    cacheSet(cacheKey, { results, fetchedAt: Date.now() });
    return results;
  }catch(e){
    return [];
  }
}

async function renderSuggestions(query){
  const box = document.getElementById("suggestBox");
  if(!query || query.length < 1){
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }
  const results = await searchSymbols(query);
  if(results.length === 0){
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = "";
  for(const r of results){
    const item = document.createElement("div");
    item.className = "suggest-item";
    const logoUrl = await fetchLogo(r.symbol);
    item.innerHTML = `
      <div class="suggest-logo">${logoUrl ? `<img src="${logoUrl}" alt="${r.symbol}">` : `<span>${r.symbol.slice(0,4)}</span>`}</div>
      <div class="suggest-text">
        <span class="suggest-sym">${r.symbol}</span>
        <span class="suggest-name">${r.description || ""}</span>
      </div>
    `;
    item.onclick = ()=>{
      const sym = r.symbol.toUpperCase();
      if(!WATCHLIST.includes(sym) && !extraSearched.includes(sym)){
        extraSearched.push(sym);
      }
      document.getElementById("searchInput").value = "";
      box.classList.remove("open");
      box.innerHTML = "";
      loadWeek(false);
    };
    box.appendChild(item);
  }
  box.classList.add("open");
}

let searchTimeout;
document.getElementById("searchInput").addEventListener("input", (e)=>{
  clearTimeout(searchTimeout);
  const val = e.target.value.trim();
  searchTimeout = setTimeout(()=>{
    renderSuggestions(val);
  }, 400);
});

document.addEventListener("click", (e)=>{
  const box = document.getElementById("suggestBox");
  const input = document.getElementById("searchInput");
  if(e.target !== box && !box.contains(e.target) && e.target !== input){
    box.classList.remove("open");
  }
});

renderWeekTabs();
loadWeek(false);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
